      - name: Build kernel
        run: |
          export ARCH=arm64
          export TC_PATH="$(pwd)/tc/clang-r450784e/bin"
          export PATH="$TC_PATH:$PATH"
          
          export KBUILD_BUILD_USER=nobody
          export KBUILD_BUILD_HOST=android-build
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out
          
          # 1. Generate base config from the Xiaomi vendor folder
          # Check if fog-perf_defconfig exists, else fallback to spes-perf_defconfig
          if [ -f arch/arm64/configs/vendor/xiaomi/fog-perf_defconfig ]; then
              make O=out ARCH=arm64 vendor/xiaomi/fog-perf_defconfig
          else
              make O=out ARCH=arm64 vendor/xiaomi/spes-perf_defconfig
          fi

          # 2. Inject Cyberdeck & Hardware Buffer configs
          cat >> out/.config << 'EOF'
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PERF=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_FUSE_FS=y
          CONFIG_VETH=y
          CONFIG_TUN=y
          CONFIG_WIREGUARD=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_ION=y
          CONFIG_DMA_SHARED_BUFFER=y
          CONFIG_SYNC_FILE=y
          CONFIG_SW_SYNC=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          EOF

          # 3. Apply changes
          make O=out ARCH=arm64 olddefconfig

          # 4. Build the Image and Device Trees
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs dtbo 2>&1 | tee build.log || exit $?

          # 5. Merge DTB into Image.gz (Critical for Xiaomi Bootloaders)
          # This finds the correct DTB for the SM6225/fog and appends it
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/vendor/qcom/khaje-fog-overlay.dtbo > out/arch/arm64/boot/Image.gz-dtb || true
          
