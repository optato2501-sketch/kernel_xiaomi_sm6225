name: Build Fog Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies (including system Clang/LLD)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev git curl \
            zip python3 ccache \
            clang lld          # ✅ system toolchain – stable & complete

      # ❌ REMOVED the broken "Download toolchain" step entirely

      - name: Add namespace configs to fog.config
        run: |
          FOGCONFIG="arch/arm64/configs/vendor/xiaomi/fog.config"
          cat >> $FOGCONFIG << 'EOF'

          # Namespaces for LXC/container support
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PERF=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_FUSE_FS=y
          CONFIG_VETH=y
          CONFIG_TUN=y
          CONFIG_WIREGUARD=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_NAT=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          EOF

          sed -i '/# CONFIG_MEMCG is not set/d' $FOGCONFIG
          sed -i '/# CONFIG_MEMCG_SWAP is not set/d' $FOGCONFIG

      - name: Build kernel
        run: |
          export ARCH=arm64
          export KBUILD_BUILD_USER=nobody
          export KBUILD_BUILD_HOST=android-build

          # No custom PATH needed – system clang/lld are already in PATH
          export LLVM=1
          export LLVM_IAS=1          # fixes assembler version check automatically

          mkdir -p out

          # Use KCONFIG_ALLCONFIG to merge your fog.config on top of the vendor defconfig
          make O=out ARCH=arm64 vendor/fog-perf_defconfig \
            KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/xiaomi/fog.config

          make -j$(nproc) O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            Image.gz dtb.img dtbo.img 2>&1 | tee build.log || exit $?

      - name: Package kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Kernel image not found!"
            cat build.log | tail -50
            exit 1
          fi

          git clone --depth=1 \
            https://github.com/CHRISL7/AnyKernel3 AnyKernel3

          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtb.img AnyKernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true

          cat > AnyKernel3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Fog Custom Kernel with Namespace Support
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fog
          device.name2=wind
          device.name3=rain
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          cd AnyKernel3
          zip -r9 ../Fog-Namespace-Kernel.zip * \
            --exclude=".git/*" \
            --exclude="*.zip"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Fog-Namespace-Kernel
          path: Fog-Namespace-Kernel.zip
          retention-days: 7
